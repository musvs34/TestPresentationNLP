<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.5" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#5c2d91"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f5fbff" stop-opacity="0.86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0078d4"/>
    </marker>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 48px; font-weight: 650; fill: #101827; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 23px; fill: #54677c; }
      .h2 { font-family: "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #101827; }
      .h3 { font-family: "Segoe UI", Arial, sans-serif; font-size: 23px; font-weight: 650; fill: #101827; }
      .body { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; fill: #41546b; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; fill: #66788d; }
      .chip { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 650; fill: #0078d4; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 17px; fill: #27364a; }
      .white { fill: #ffffff; }
      .line { stroke: #0078d4; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #d6e8fa; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="206" cy="180" r="190" fill="#dff1ff" opacity="0.58"/>
  <circle cx="1730" cy="910" r="240" fill="#eaf3ff" opacity="0.8"/>

  <rect x="78" y="184" width="492" height="752" rx="28" fill="url(#glass)" stroke="#d7e9fb" filter="url(#shadow)"/>
  <rect x="112" y="218" width="132" height="42" rx="21" fill="#e8f3ff"/>
  <text x="142" y="246" class="chip">CSV sources</text>
  <text x="112" y="306" class="h2">Inputs pris en compte</text>

  <g filter="url(#soft)">
    <rect x="112" y="344" width="410" height="104" rx="18" fill="#ffffff" stroke="#d7e9fb"/>
    <rect x="136" y="368" width="46" height="46" rx="12" fill="#0078d4"/>
    <text x="150" y="397" class="white body" font-weight="700">CSV</text>
    <text x="202" y="376" class="h3">Mots_interdits.csv</text>
    <text x="202" y="408" class="body">Regles metier : categorie, terme interdit, justification.</text>
    <text x="202" y="433" class="small">Alimente surtout generic, regex et le referentiel global.</text>

    <rect x="112" y="470" width="410" height="104" rx="18" fill="#ffffff" stroke="#d7e9fb"/>
    <rect x="136" y="494" width="46" height="46" rx="12" fill="#00a2ed"/>
    <text x="150" y="523" class="white body" font-weight="700">CSV</text>
    <text x="202" y="502" class="h3">spacy_synonyms.csv</text>
    <text x="202" y="534" class="body">Synonymes et variantes semantiques.</text>
    <text x="202" y="559" class="small">Utilise par la branche spacy.</text>

    <rect x="112" y="596" width="410" height="104" rx="18" fill="#ffffff" stroke="#d7e9fb"/>
    <rect x="136" y="620" width="46" height="46" rx="12" fill="#107c10"/>
    <text x="150" y="649" class="white body" font-weight="700">CSV</text>
    <text x="202" y="628" class="h3">whitelist.csv</text>
    <text x="202" y="660" class="body">Expressions a exclure des alertes.</text>
    <text x="202" y="685" class="small">Filtre les faux positifs apres detection.</text>

    <rect x="112" y="722" width="410" height="104" rx="18" fill="#ffffff" stroke="#d7e9fb"/>
    <rect x="136" y="746" width="46" height="46" rx="12" fill="#8764b8"/>
    <text x="150" y="775" class="white body" font-weight="700">CSV</text>
    <text x="202" y="754" class="h3">test_cases.csv</text>
    <text x="202" y="786" class="body">Cas de test pour mesurer les performances.</text>
    <text x="202" y="811" class="small">Compare precision, scores et detections par branche.</text>
  </g>

  <rect x="708" y="352" width="322" height="292" rx="34" fill="url(#win)" filter="url(#shadow)"/>
  <rect x="744" y="390" width="250" height="54" rx="14" fill="#ffffff" opacity="0.17"/>
  <rect x="744" y="466" width="250" height="54" rx="14" fill="#ffffff" opacity="0.17"/>
  <rect x="744" y="542" width="250" height="54" rx="14" fill="#ffffff" opacity="0.17"/>
  <text x="770" y="425" class="white h3">JupyterHub notebook</text>
  <text x="772" y="501" class="white body">analyze_text()</text>
  <text x="772" y="577" class="white body">comparison_df / scores</text>
  <text x="710" y="700" class="h2">Comparaison centrale</text>
  <text x="678" y="735" class="body">Activation des branches et consolidation des resultats.</text>

  <path class="line" d="M572 560 C630 560, 650 500, 700 500"/>

  <path class="line" d="M1032 495 C1090 270, 1120 240, 1176 240"/>
  <path class="line" d="M1032 505 C1090 420, 1120 400, 1176 400"/>
  <path class="line" d="M1032 525 C1090 610, 1120 630, 1176 630"/>
  <path class="line" d="M1032 535 C1090 795, 1120 825, 1176 825"/>

  <g filter="url(#shadow)">
    <rect x="1198" y="174" width="630" height="142" rx="24" fill="#ffffff" stroke="#cfe6ff"/>
    <rect x="1224" y="205" width="76" height="76" rx="19" fill="#e8f3ff"/>
    <text x="1238" y="252" class="h3" fill="#0078d4">01</text>
    <text x="1326" y="220" class="h2">generic</text>
    <text x="1326" y="257" class="body">Detecte : termes exacts, racines, fuzzy et synonymes configures.</text>
    <text x="1326" y="286" class="body">Couvre : regles metier explicables et alertes scorees.</text>

    <rect x="1198" y="352" width="630" height="142" rx="24" fill="#ffffff" stroke="#cfe6ff"/>
    <rect x="1224" y="383" width="76" height="76" rx="19" fill="#e8f3ff"/>
    <text x="1238" y="430" class="h3" fill="#0078d4">02</text>
    <text x="1326" y="398" class="h2">spacy</text>
    <text x="1326" y="435" class="body">Detecte : lemmes, formes flechies, racines et synonymes enrichis.</text>
    <text x="1326" y="464" class="body">Enrichit : le fichier spacy_synonyms.csv depuis les termes metier.</text>

    <rect x="1198" y="580" width="630" height="142" rx="24" fill="#ffffff" stroke="#cfe6ff"/>
    <rect x="1224" y="611" width="76" height="76" rx="19" fill="#e8f3ff"/>
    <text x="1238" y="658" class="h3" fill="#0078d4">03</text>
    <text x="1326" y="626" class="h2">gliner</text>
    <text x="1326" y="663" class="body">Detecte : entites par labels, meme sans mot cle exact.</text>
    <text x="1326" y="692" class="body">Couvre : signaux sensibles et notions de conformite/conseil.</text>

    <rect x="1198" y="758" width="630" height="142" rx="24" fill="#ffffff" stroke="#cfe6ff"/>
    <rect x="1224" y="789" width="76" height="76" rx="19" fill="#e8f3ff"/>
    <text x="1238" y="836" class="h3" fill="#0078d4">04</text>
    <text x="1326" y="804" class="h2">regex</text>
    <text x="1326" y="841" class="body">Detecte : formats structures via motifs deterministes.</text>
    <text x="1326" y="870" class="body">Couvre : email, telephone FR, IBAN FR et NIR francais.</text>
  </g>

  <rect x="86" y="966" width="1742" height="54" rx="27" fill="#ffffff" opacity="0.82" stroke="#d7e9fb"/>
  <text x="122" y="999" class="body">Sorties notebook : case_summary, alerts, whitelist_ignored, comparison, count_pivot, score_view et branch_errors en CSV.</text>
</svg>
